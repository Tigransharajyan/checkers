services:
  - type: web
    name: shatimi-checkers
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # Render injects DATABASE_URL automatically from the linked database,
      # but Spring Boot needs jdbc:postgresql:// format.
      # We override with the explicit JDBC URL using fromDatabase fields.
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: checkers-db
          property: connectionString

      # JWT secret — generated randomly per environment, never stored in Git
      - key: JWT_SECRET
        generateValue: true

      # Set comma-separated Groq keys in the Render environment, never in this repository.
      - key: GROQ_API_KEYS
        sync: false

      # Canonicals use Render's real RENDER_EXTERNAL_URL automatically.
      # For a custom domain, add SITE_BASE_URL with its HTTPS origin in Dashboard.
      # Staging: set SITE_INDEXING_ENABLED=false.
      # Optional GOOGLE_SITE_VERIFICATION / BING_SITE_VERIFICATION take meta-tag content tokens.

      # Render provides PORT automatically — Spring Boot reads ${PORT:8080}
      # No need to set PORT manually; Render manages it

databases:
  - name: checkers-db
    databaseName: checkers
    user: checkers
    plan: free
    region: frankfurt
