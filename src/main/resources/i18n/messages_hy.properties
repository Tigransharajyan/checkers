seo.home.title=Ռուսական շաշկի առցանց — խաղացեք ընկերոջ կամ բոտի հետ
seo.home.description=Խաղացեք ռուսական շաշկի 8×8 խաղատախտակով հենց դիտարկիչում։ Գտեք մրցակից, հրավիրեք ընկերոջ կամ մարզվեք բոտի հետ։ Հայերեն, ռուսերեն և անգլերեն միջերես։
seo.faq.title=Ռուսական շաշկու կանոններ — քայլեր, հարվածներ և դամա
seo.faq.description=Ծանոթացեք խաղում կիրառվող ռուսական շաշկու կանոններին՝ 8×8 խաղատախտակ, պարտադիր հարված, դամայի քայլեր և փոխարկում։ Օգնություն ընկերոջ կամ բոտի հետ խաղալու համար։
seo.play.title=Ընտրեք շաշկու խաղը — մրցակից, ընկեր կամ բոտ
seo.play.description=Գտեք պատահական մրցակից, ստեղծեք ընկերոջ հրավեր կամ մարզվեք ռուսական շաշկու բոտի հետ՝ ընտրելով բարդությունը։
seo.tasks.title=Շաշկու օրվա խնդիր — մարտավարական համակցություններ
seo.tasks.description=Գտեք պարտադրված հաղթանակը ռուսական շաշկու ամենօրյա խնդրում։ Իրականացրեք համակցությունը ավտոմատ պաշտպանության դեմ՝ սովորական խաղի կանոններով։
seo.progress.title=Ձեր շաշկու առաջընթացը — խաղերի արդյունքներ
seo.progress.description=Դիտեք պահպանված խաղերի արդյունքներն ու հաղթանակների տոկոսը։ Վիճակագրությունը հիմնված է ավարտված խաղերի վրա՝ առանց պայմանական վարկանիշի։
seo.history.title=Ձեր շաշկու խաղերի պատմությունը
seo.history.description=Դիտեք ավարտված խաղերը, մրցակիցներին և արդյունքները։ Մուտք գործեք՝ հաշվում պահպանված խաղերի պատմությունը տեսնելու համար։
seo.login.title=Մուտք հաշիվ — Շաշկի Առցանց
seo.login.description=Մուտք գործեք Շաշկի Առցանց՝ արդյունքներն ու խաղերի պատմությունը պահպանելու համար, կամ շարունակեք որպես հյուր։
seo.register.title=Ստեղծել հաշիվ — Շաշկի Առցանց
seo.register.description=Ստեղծեք Շաշկի Առցանց հաշիվ՝ խաղերի պատմությունը պահպանելու, արդյունքներին հետևելու և միջերեսի լեզուն ընտրելու համար։
seo.error.title=Էջը հասանելի չէ — Շաշկի Առցանց
