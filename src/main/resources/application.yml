# Shared settings. The --- separators below introduce dev and prod profile overrides.
spring:
  config:
    # Local secrets are optional, ignored by Git and never packaged in the application JAR.
    import: "optional:file:.env[.properties]"
  application:
    name: checkers-online
  profiles:
    # Local runs use H2. SPRING_PROFILES_ACTIVE=prod selects PostgreSQL on the server.
    active: dev
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  thymeleaf:
    cache: false
  jpa:
    # Resolve JPA relationships inside service transactions rather than during view rendering.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: text/html,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml,image/svg+xml
  port: ${PORT:8080}

app:
  assistant:
    groq:
      # Comma-separated server keys, tried in order; no key keeps local FAQ help available.
      api-keys: ${GROQ_API_KEYS:${GROQ_API_KEY:}}
      model: ${GROQ_MODEL:openai/gpt-oss-120b}
      requests-per-minute: ${GROQ_REQUESTS_PER_MINUTE:12}
  jwt:
    # The fallback is for development; production supplies its secret through the environment.
    secret: ${JWT_SECRET:dev-only-change-me-to-a-long-enough-secret-key-for-hs256-checkers-online}
    access-token-ttl-minutes: 30
    refresh-token-ttl-days: 3
  site:
    # Public origin for canonical URLs and sitemap; SITE_BASE_URL overrides the hosting domain.
    base-url: ${SITE_BASE_URL:${RENDER_EXTERNAL_URL:http://localhost:8080}}
    indexing-enabled: ${SITE_INDEXING_ENABLED:true}
    google-verification: ${GOOGLE_SITE_VERIFICATION:}
    bing-verification: ${BING_SITE_VERIFICATION:}
  game:
    reconnect-timeout-seconds: 60
    # The queue lives in one process; multiple instances require shared matchmaking infrastructure.
    matchmaking-timeout-seconds: 120
    # Minimum full moves before an offer: 0 for casual play, or 20 for that tournament regulation.
    draw-offer-minimum-moves: 0

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # The development database lives in process memory and is lost when the process stops.
    url: jdbc:h2:mem:checkers;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.checkers: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    # DatabaseConfig builds the DataSource from DATABASE_URL or individual DB_* variables.
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  web:
    resources:
      # Content hashes in asset URLs allow long caching while changed content receives a new URL.
      chain:
        strategy:
          content:
            enabled: true
            paths: /css/**,/js/**,/images/**,/fonts/**
      cache:
        cachecontrol:
          max-age: 365d
          cache-public: true
  thymeleaf:
    cache: true

logging:
  level:
    com.checkers: INFO
    root: WARN
