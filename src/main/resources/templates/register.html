<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${currentLocale}">
<head>
  <th:block th:replace="~{fragments/head :: meta}"></th:block>
  <title th:text="|#{auth.register.title} — #{app.title}|">Register</title>
  <th:block th:replace="~{fragments/seo :: hreflang('/register')}"></th:block>
  <script th:src="@{/js/assistant.js}" defer></script>
  <script th:src="@{/js/auth.js}" defer></script>
</head>
<body class="auth-page">
  <div class="auth-board-backdrop" aria-hidden="true"></div>

  <div class="auth-top-lang" role="group" th:aria-label="#{lang.label}">
    <div class="lang-switch" th:aria-label="#{lang.label}">
      <button type="button" data-lang="en" th:text="#{lang.en}">EN</button>
      <button type="button" data-lang="ru" th:text="#{lang.ru}">RU</button>
      <button type="button" data-lang="hy" th:text="#{lang.hy}">HY</button>
    </div>
  </div>

  <div class="auth-card">
    <div class="auth-mark" aria-hidden="true"><i></i><i></i></div>
    <h1 th:text="#{auth.register.title}">Sign up</h1>
    <p class="lead" th:text="#{app.tagline}">Play online</p>
    <form data-auth-form="register" novalidate>
      <div class="field">
        <label for="username" th:text="#{auth.username}">Username</label>
        <div class="auth-input-control"><i data-lucide="user-round"></i><input id="username" name="username" required minlength="3" maxlength="50" autocomplete="username" th:placeholder="#{auth.username}"/></div>
        <span class="field-error" data-field-error="username"></span>
      </div>
      <div class="field">
        <label for="email" th:text="#{auth.email}">Email</label>
        <div class="auth-input-control"><i data-lucide="mail"></i><input id="email" name="email" type="email" required autocomplete="email" th:placeholder="#{auth.email}"/></div>
        <span class="field-error" data-field-error="email"></span>
      </div>
      <div class="field">
        <label for="password" th:text="#{auth.password}">Password</label>
        <div class="auth-input-control"><i data-lucide="lock-keyhole"></i><input id="password" name="password" type="password" required minlength="8" autocomplete="new-password" th:placeholder="#{auth.password}"/></div>
        <span class="field-error" data-field-error="password"></span>
      </div>
      <button type="submit" class="btn btn-primary btn-block" th:text="#{auth.submitRegister}">Sign up</button>
      <button type="button" class="btn btn-ghost btn-block" data-guest-login th:text="#{auth.guest}">Guest</button>
    </form>
    <p class="auth-links">
      <span th:text="#{auth.haveAccount}">Have account?</span>
      <a th:href="@{/login(lang=${currentLocale})}" th:text="#{nav.login}">Log in</a>
      <a class="auth-home-link" th:href="@{/(lang=${currentLocale})}">&larr; <span th:text="#{nav.home}">Lobby</span></a>
    </p>
  </div>

  <div id="toast-root" aria-live="polite"></div>
  <div th:replace="~{fragments/assistant :: widget}"></div>
</body>
</html>
