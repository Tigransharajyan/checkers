<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${currentLocale}">
<head>
  <th:block th:replace="~{fragments/head :: meta}"></th:block>
  <script th:src="@{/js/assistant.js}" defer></script><script>var global = window;</script>
  <script th:src="@{/js/vendor/sockjs-1.6.1.min.js}" defer></script><script th:src="@{/js/vendor/stomp-2.3.3.min.js}" defer></script><script th:src="@{/js/lobby.js}" defer></script>
</head>
<body>
<div class="app-shell play-launcher-shell"><div th:replace="~{fragments/sidebar :: sidebar('play')}"></div><div th:replace="~{fragments/sidebar :: mobile('play')}"></div>
<main class="content play-launcher-content" id="main-content" tabindex="-1"><div class="inline-load-error hidden" data-account-refresh-error role="status"><span th:text="#{common.accountCheckFailed}">Your saved session could not be checked. Retry.</span><button type="button" class="text-button" data-account-refresh-retry th:text="#{tasks.retry}">Retry</button></div><div class="play-launcher-grid"><div class="play-launcher-board"><div th:replace="~{fragments/position :: preview}"></div></div><section class="play-launcher-options" aria-labelledby="play-launcher-title"><header class="play-launcher-heading"><img th:src="@{/images/modes/checkers.svg}" width="40" height="40" alt=""/><div><h1 id="play-launcher-title" th:text="#{redesign.play.title}">Play Russian checkers</h1><p th:text="#{play.launcher.subtitle}">Russian checkers · 8×8. Choose how you want to play.</p></div></header><div th:replace="~{fragments/modes :: selector(false)}"></div></section></div></main></div>
<div id="toast-root" aria-live="polite"></div><div th:replace="~{fragments/assistant :: widget}"></div>
</body>
</html>
