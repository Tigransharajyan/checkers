<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${currentLocale}">
<head>
  <th:block th:replace="~{fragments/head :: meta}"></th:block>
  <script th:src="@{/js/assistant.js}" defer></script>
  <script th:src="@{/js/history.js}" defer></script>
</head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments/sidebar :: sidebar('history')}"></div>
  <div th:replace="~{fragments/sidebar :: mobile('history')}"></div>

  <main class="content" id="main-content" tabindex="-1">
    <section class="page-panel history-page">
      <header class="page-title-row"><div><h1 th:text="#{history.title}">History</h1><p class="history-intro" th:text="#{history.subtitle}">Completed games saved to your account.</p></div><a class="btn btn-primary" th:href="@{/play(lang=${currentLocale})}" th:text="#{nav.play}">Play</a></header>
      <p class="history-status" data-history-status role="status" th:text="#{common.loading}">Loading…</p><button class="btn btn-ghost hidden" data-history-retry th:text="#{tasks.retry}">Retry</button>
      <!-- Guest Blocked Banner -->
      <div class="empty-state hidden" data-history-guest>
        <h2 style="font-size:var(--fs-18);margin-bottom:var(--s-8)" th:text="#{history.guestBlocked}">History is only for registered users</h2>
        <p class="muted" style="margin:0 0 var(--s-20)" th:text="#{history.guestSubtitle}">Sign in to track your game stats and win history.</p>
        <div class="actions-row">
          <a class="btn btn-primary" th:href="@{/login(lang=${currentLocale})}" th:text="#{nav.login}">Log in</a>
          <a class="btn btn-ghost" th:href="@{/register(lang=${currentLocale})}" th:text="#{nav.register}">Sign up</a>
        </div>
      </div>

      <!-- Empty State -->
      <div class="empty-state hidden" data-history-empty>
        <p class="muted" style="margin:0 0 var(--s-16)" th:text="#{history.empty}">No finished games yet.</p>
        <a class="btn btn-primary" th:href="@{/play(lang=${currentLocale})}" th:text="#{nav.play}">Play Now</a>
      </div>

      <!-- History Table -->
      <div class="history-table-container hidden" data-history-table-wrap tabindex="0" role="region" th:aria-label="#{history.title}" aria-describedby="history-scroll-hint">
        <table class="history-table">
          <thead>
          <tr>
            <th th:text="#{history.date}">Date</th>
            <th th:text="#{history.mode}">Mode</th>
            <th th:text="#{history.players}">Players</th>
            <th th:text="#{history.winner}">Winner</th>
            <th th:text="#{history.result}">Result</th>
            <th><span class="sr-only" th:text="#{history.open}">Open</span></th>
          </tr>
          </thead>
          <tbody data-history-body></tbody>
        </table>
      </div>
      <p class="scroll-hint hidden" id="history-scroll-hint" th:text="#{redesign.history.scroll}">Scroll sideways to see all columns.</p>
    </section>
  </main>
</div>

<div id="toast-root" aria-live="polite"></div>
<div th:replace="~{fragments/assistant :: widget}"></div>
</body>
</html>
