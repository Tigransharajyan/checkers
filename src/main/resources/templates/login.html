<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${currentLocale}">
<head>
  <th:block th:replace="~{fragments/head :: meta}"></th:block>
  <script th:src="@{/js/auth.js}" defer></script>
</head>
<body class="auth-page">
  <header class="auth-header">
    <a class="auth-brand" th:href="@{/home(lang=${currentLocale})}"><span class="logo-mark" aria-hidden="true"><i></i><i></i></span><span th:text="#{app.title}">Checkers Online</span></a>
    <div class="lang-switch" role="group" th:aria-label="#{lang.label}">
      <a data-lang="en" hreflang="en" lang="en" th:href="${languageLinks.en}" th:text="#{lang.en}">EN</a>
      <a data-lang="ru" hreflang="ru" lang="ru" th:href="${languageLinks.ru}" th:text="#{lang.ru}">RU</a>
      <a data-lang="hy" hreflang="hy" lang="hy" th:href="${languageLinks.hy}" th:text="#{lang.hy}">HY</a>
    </div>
  </header>

  <main class="auth-card" id="main-content" tabindex="-1">
    <h1 th:text="#{auth.login.title}">Log in</h1>
    <p class="lead" th:text="#{redesign.auth.loginHint}">Save your next games.</p>
    <form data-auth-form="login" novalidate>
      <p class="form-status" data-form-status role="status"></p>
      <div class="field">
        <label for="usernameOrEmail" th:text="#{auth.usernameOrEmail}">User</label>
        <div class="auth-input-control"><i aria-hidden="true" data-lucide="user-round"></i><input id="usernameOrEmail" aria-describedby="usernameOrEmail-error" name="usernameOrEmail" required autocomplete="username" th:placeholder="#{auth.usernameOrEmail}"/></div>
        <span class="field-error" id="usernameOrEmail-error" data-field-error="usernameOrEmail" aria-live="polite"></span>
      </div>
      <div class="field">
        <label for="password" th:text="#{auth.password}">Password</label>
        <div class="auth-input-control"><i aria-hidden="true" data-lucide="lock-keyhole"></i><input id="password" aria-describedby="password-error" name="password" type="password" required autocomplete="current-password" th:placeholder="#{auth.password}"/></div>
        <span class="field-error" id="password-error" data-field-error="password" aria-live="polite"></span>
      </div>
      <button type="submit" class="btn btn-primary btn-block"><span th:text="#{auth.submitLogin}">Log in</span><i aria-hidden="true" data-lucide="arrow-right"></i></button>
      <button type="button" class="btn btn-ghost btn-block" data-guest-login th:text="#{auth.guest}">Guest</button>
      <p class="muted" th:text="#{auth.guestHint}">Hint</p>
    </form>
    <p class="auth-links">
      <span th:text="#{auth.noAccount}">No account?</span>
      <a th:href="@{/register(lang=${currentLocale})}" th:text="#{nav.register}">Sign up</a>
      <a class="auth-home-link" th:href="@{/home(lang=${currentLocale})}">&larr; <span th:text="#{nav.home}">Lobby</span></a>
    </p>
  </main>

  <div id="toast-root" aria-live="polite"></div>
</body>
</html>
