<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="metadata">
  <title th:text="${seo.title}">Checkers Online</title>
  <meta name="description" th:content="${seo.description}"/>
  <meta name="robots" th:content="${seo.robots}"/>
  <link rel="canonical" th:href="${seo.canonical}"/>
  <link th:each="alternate : ${seo.alternates}" rel="alternate" th:hreflang="${alternate.key}" th:href="${alternate.value}"/>
  <meta property="og:type" content="website"/>
  <meta property="og:site_name" th:content="#{app.title}"/>
  <meta property="og:title" th:content="${seo.title}"/>
  <meta property="og:description" th:content="${seo.description}"/>
  <meta property="og:url" th:content="${seo.canonical}"/>
  <meta property="og:locale" th:content="${seo.ogLocale}"/>
  <meta property="og:image" th:content="${seo.image}"/>
  <meta property="og:image:type" content="image/jpeg"/>
  <meta property="og:image:width" content="1200"/>
  <meta property="og:image:height" content="630"/>
  <meta property="og:image:alt" th:content="${seo.imageAlt}"/>
  <meta name="twitter:card" content="summary_large_image"/>
  <meta name="twitter:title" th:content="${seo.title}"/>
  <meta name="twitter:description" th:content="${seo.description}"/>
  <meta name="twitter:image" th:content="${seo.image}"/>
  <meta name="twitter:image:alt" th:content="${seo.imageAlt}"/>
  <meta th:if="${!#strings.isEmpty(seo.googleVerification)}" name="google-site-verification" th:content="${seo.googleVerification}"/>
  <meta th:if="${!#strings.isEmpty(seo.bingVerification)}" name="msvalidate.01" th:content="${seo.bingVerification}"/>
  <script th:if="${seo.structuredData != null}" type="application/ld+json" th:utext="${seo.structuredData}"></script>
</th:block>
